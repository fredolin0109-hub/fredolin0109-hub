<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 320" width="180" height="192" fill="none">
  <defs>
    <!-- Kinetic Violet Glow -->
    <filter id="eye-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="suit-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A24" />
      <stop offset="50%" stop-color="#0E0E17" />
      <stop offset="100%" stop-color="#05050A" />
    </linearGradient>

    <linearGradient id="silver-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7B2CBF" />
      <stop offset="50%" stop-color="#E0AAFF" />
      <stop offset="100%" stop-color="#9D4EDD" />
    </linearGradient>

    <linearGradient id="vibranium-energy" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#9D4EDD" />
      <stop offset="100%" stop-color="#C77DFF" />
    </linearGradient>
  </defs>

  <style>
    .glow-eyes {
      animation: pulse-eye 2.4s ease-in-out infinite;
    }
    @keyframes pulse-eye {
      0%, 100% { filter: drop-shadow(0 0 3px #9D4EDD); opacity: 0.85; }
      50% { filter: drop-shadow(0 0 10px #C77DFF); opacity: 1; }
    }
    .kinetic-lines {
      animation: pulse-lines 3s ease-in-out infinite alternate;
    }
    @keyframes pulse-lines {
      0% { opacity: 0.4; }
      100% { opacity: 0.95; filter: drop-shadow(0 0 4px #C77DFF); }
    }
  </style>

  <!-- Helmet Silhouette / Outer Shell -->
  <path d="M 60 70 L 100 20 L 130 65 L 170 65 L 200 20 L 240 70 L 255 160 L 225 250 L 150 295 L 75 250 L 45 160 Z" 
        fill="url(#suit-body)" stroke="#3C1361" stroke-width="3" />

  <!-- Ears (Vibranium Sharp Tips) -->
  <polygon points="60,70 100,20 108,70" fill="#0A0A10" stroke="#7B2CBF" stroke-width="1.5" />
  <polygon points="240,70 200,20 192,70" fill="#0A0A10" stroke="#7B2CBF" stroke-width="1.5" />

  <!-- Brow Plate & Temple Highlights -->
  <path d="M 75 110 L 150 145 L 225 110" stroke="url(#silver-accent)" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M 110 70 L 150 100 L 190 70" stroke="#7B2CBF" stroke-width="2" fill="none" />
  <path d="M 150 20 L 150 100" stroke="#9D4EDD" stroke-width="2" stroke-dasharray="4,4" opacity="0.8" />

  <!-- Forehead Tribal Vibranium Patterns -->
  <g class="kinetic-lines">
    <path d="M 130 90 L 150 115 L 170 90" stroke="#C77DFF" stroke-width="2.5" fill="none" />
    <circle cx="150" cy="80" r="3.5" fill="#C77DFF" />
  </g>

  <!-- Glowing Eyes (Wakanda Vibranium Purple) -->
  <g class="glow-eyes" filter="url(#eye-glow)">
    <!-- Left Eye -->
    <polygon points="85,145 125,160 95,170" fill="#FFFFFF" stroke="#C77DFF" stroke-width="2" />
    <!-- Right Eye -->
    <polygon points="215,145 175,160 205,170" fill="#FFFFFF" stroke="#C77DFF" stroke-width="2" />
  </g>

  <!-- Cheekbones & Jawlines (Panther Whisker Plates) -->
  <path d="M 65 175 L 115 195 L 150 220 L 185 195 L 235 175" stroke="#3C1361" stroke-width="2" fill="none" />
  <path d="M 80 205 L 120 225 L 150 245 L 180 225 L 220 205" stroke="url(#silver-accent)" stroke-width="1.5" fill="none" />

  <!-- Nose Bridge & Snout Contour -->
  <polygon points="140,165 160,165 155,190 145,190" fill="#0A0A12" stroke="#7B2CBF" stroke-width="1.5" />
  <path d="M 135 195 L 150 205 L 165 195" stroke="#9D4EDD" stroke-width="2" fill="none" />

  <!-- Chin / Jaw Claws Accent -->
  <polygon points="135,270 150,290 165,270" fill="url(#silver-accent)" />

  <!-- Kinetic Glow Suit Inlays -->
  <g class="kinetic-lines">
    <line x1="95" y1="230" x2="135" y2="265" stroke="#C77DFF" stroke-width="2" stroke-linecap="round" />
    <line x1="205" y1="230" x2="165" y2="265" stroke="#C77DFF" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
