<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 100" width="100%" height="100" fill="none">
  <defs>
    <!-- Kinetic Vibranium Glow Filter -->
    <filter id="vibranium-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Metallic Vibranium Silver-Purple Gradient -->
    <linearGradient id="silver-claw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#D8B4E2" />
      <stop offset="70%" stop-color="#9D4EDD" />
      <stop offset="100%" stop-color="#240046" />
    </linearGradient>

    <linearGradient id="necklace-cord" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B0B14" />
      <stop offset="25%" stop-color="#7B2CBF" />
      <stop offset="50%" stop-color="#C77DFF" />
      <stop offset="75%" stop-color="#7B2CBF" />
      <stop offset="100%" stop-color="#0B0B14" />
    </linearGradient>
  </defs>

  <style>
    .glow-pulse {
      animation: pulse 3s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      0% { filter: drop-shadow(0 0 2px #7B2CBF); opacity: 0.85; }
      50% { filter: drop-shadow(0 0 8px #C77DFF); opacity: 1; }
      100% { filter: drop-shadow(0 0 14px #E0AAFF); opacity: 0.95; }
    }
    .claw {
      transition: transform 0.3s;
    }
  </style>

  <!-- Necklace High-Tech Cord -->
  <path d="M 50 35 Q 400 65 750 35" stroke="url(#necklace-cord)" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9" />
  <path d="M 50 35 Q 400 65 750 35" stroke="#C77DFF" stroke-width="1.5" stroke-dasharray="6,4" fill="none" opacity="0.7" />

  <g class="glow-pulse" filter="url(#vibranium-glow)">
    <!-- Outer Claws Left -->
    <polygon points="120,38 128,60 120,68 112,60" fill="url(#silver-claw)" />
    <polygon points="160,40 170,64 160,73 150,64" fill="url(#silver-claw)" />
    <polygon points="205,43 216,69 205,79 194,69" fill="url(#silver-claw)" />
    <polygon points="255,46 268,75 255,85 242,75" fill="url(#silver-claw)" />
    <polygon points="310,49 324,80 310,91 296,80" fill="url(#silver-claw)" />

    <!-- Center Claws (Larger) -->
    <polygon points="370,52 385,86 370,97 355,86" fill="url(#silver-claw)" />
    
    <!-- King's Center Fang Claws -->
    <polygon points="400,53 418,92 400,103 382,92" fill="url(#silver-claw)" />
    
    <polygon points="430,52 445,86 430,97 415,86" fill="url(#silver-claw)" />

    <!-- Outer Claws Right -->
    <polygon points="490,49 504,80 490,91 476,80" fill="url(#silver-claw)" />
    <polygon points="545,46 558,75 545,85 532,75" fill="url(#silver-claw)" />
    <polygon points="595,43 606,69 595,79 584,69" fill="url(#silver-claw)" />
    <polygon points="640,40 650,64 640,73 630,64" fill="url(#silver-claw)" />
    <polygon points="680,38 688,60 680,68 672,60" fill="url(#silver-claw)" />

    <!-- Center Vibranium Energy Core Bead -->
    <circle cx="400" cy="53" r="5" fill="#FFFFFF" stroke="#C77DFF" stroke-width="2" />
  </g>
</svg>
