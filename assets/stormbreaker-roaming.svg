<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 130" width="100%" height="130" fill="none">
  <defs>
    <!-- Lightning Glow Filter -->
    <filter id="lightning-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Asgardian Uru Metal Gradient -->
    <linearGradient id="uru-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="35%" stop-color="#94A3B8" />
      <stop offset="70%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Axe Blade Cyan Energy Edge -->
    <linearGradient id="axe-edge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>

    <!-- Groot Wooden Handle -->
    <linearGradient id="groot-wood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9A3412" />
      <stop offset="50%" stop-color="#78350F" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>
  </defs>

  <style>
    /* Stormbreaker Roaming Flight across the entire width */
    @keyframes roam-across {
      0% {
        transform: translate(-60px, 15px) rotate(-18deg);
      }
      25% {
        transform: translate(260px, -8px) rotate(8deg);
      }
      50% {
        transform: translate(520px, 18px) rotate(-10deg);
      }
      75% {
        transform: translate(780px, -5px) rotate(12deg);
      }
      100% {
        transform: translate(1040px, 15px) rotate(-18deg);
      }
    }

    .stormbreaker-flight {
      animation: roam-across 7s linear infinite;
    }

    /* Electric Lightning Flicker */
    @keyframes lightning-flicker {
      0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 6px #38BDF8); }
      20% { opacity: 0.3; }
      40% { opacity: 1; filter: drop-shadow(0 0 14px #7DD3FC); }
      60% { opacity: 0.4; }
      80% { opacity: 0.95; filter: drop-shadow(0 0 10px #0284C7); }
    }

    .lightning-trail {
      animation: lightning-flicker 0.6s ease-in-out infinite;
    }
  </style>

  <!-- Flight Corridor Ambient Lightning Track -->
  <path d="M 0 65 Q 250 45, 500 70 T 1000 60" stroke="#0369A1" stroke-width="1" stroke-dasharray="8,12" opacity="0.4" />

  <!-- Roaming Stormbreaker Group -->
  <g class="stormbreaker-flight">

    <!-- Electric Lightning Aura / Sparks trailing the axe -->
    <g class="lightning-trail" filter="url(#lightning-glow)">
      <!-- Lightning bolt sparks trailing behind -->
      <polyline points="-35,50 -20,40 -25,55 -10,48 -18,65 -5,58" stroke="#38BDF8" stroke-width="2.5" fill="none" />
      <polyline points="-30,68 -15,75 -22,62 -8,70 0,60" stroke="#7DD3FC" stroke-width="2" fill="none" />
      <polyline points="20,10 32,25 22,30 38,42" stroke="#38BDF8" stroke-width="2" fill="none" />
      <polyline points="45,65 60,80 50,85 70,100" stroke="#38BDF8" stroke-width="2.5" fill="none" />
    </g>

    <!-- Stormbreaker Handle (Groot's Vine/Branch Wood) -->
    <path d="M -30 65 Q 15 55, 60 48" stroke="url(#groot-wood)" stroke-width="7" stroke-linecap="round" />
    <path d="M -28 65 Q 15 55, 60 48" stroke="#B45309" stroke-width="1.5" stroke-dasharray="5,6" stroke-linecap="round" opacity="0.6" />
    
    <!-- Wooden Vines wrapping around the collar -->
    <path d="M 38 48 Q 45 42, 50 52" stroke="#78350F" stroke-width="4" fill="none" />
    <path d="M 42 54 Q 48 48, 54 58" stroke="#9A3412" stroke-width="3" fill="none" />

    <!-- Uru Metal Collar / Joint -->
    <rect x="44" y="44" width="10" height="15" rx="2" fill="url(#uru-metal)" stroke="#38BDF8" stroke-width="1.5" />

    <!-- Back Hammer Head (Blunt Breaker Block) -->
    <polygon points="45,36 32,38 30,58 43,60" fill="url(#uru-metal)" stroke="#64748B" stroke-width="1.5" />
    <!-- Beveled Hammer face -->
    <polygon points="32,38 24,41 22,55 30,58" fill="#334155" stroke="#94A3B8" stroke-width="1" />
    <!-- Asgardian Rune Grooves in Hammer -->
    <line x1="36" y1="42" x2="36" y2="54" stroke="#38BDF8" stroke-width="1.5" filter="url(#lightning-glow)" />

    <!-- Front Battle Axe Head (Sweeping Curved Blade) -->
    <!-- Axe Core Plate -->
    <path d="M 54 44 Q 68 35, 88 20 Q 82 50, 85 82 Q 68 62, 54 58 Z" fill="url(#uru-metal)" stroke="#475569" stroke-width="1.5" />
    
    <!-- Razor Axe Cutting Edge with Electric Cyan Glow -->
    <path d="M 88 20 Q 82 50, 85 82" stroke="url(#axe-edge)" stroke-width="4" stroke-linecap="round" filter="url(#lightning-glow)" />

    <!-- Center Rune Inscription (Charged with Thunder Energy) -->
    <path d="M 60 48 L 74 51 L 64 56" stroke="#38BDF8" stroke-width="2" fill="none" filter="url(#lightning-glow)" />
    
    <!-- Crackling Sparks at Blade Tip -->
    <circle cx="88" cy="20" r="3" fill="#E0F2FE" filter="url(#lightning-glow)" />
    <circle cx="85" cy="82" r="2.5" fill="#38BDF8" filter="url(#lightning-glow)" />

  </g>
</svg>
