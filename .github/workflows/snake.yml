name: Generate Contribution Snake

on:
  schedule:
    # Run every 12 hours automatically
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Vibranium Black Panther contribution grid snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%239d4edd&color_dots=%23ebedf0,%23d8b4e2,%23ba68c8,%239c27b0,%236a1b9a
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23c77dff&color_dots=%23161b22,%233c1361,%236a0dad,%239d4edd,%23c77dff

      - name: Push snake svgs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
